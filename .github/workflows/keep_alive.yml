name: Keep Render Alive

on:
  schedule:
    # Every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Zdorovya Backend
        run: |
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" https://zdorovya.onrender.com/api/ping || true
          echo "Keep-alive ping sent at $(date -u)"
